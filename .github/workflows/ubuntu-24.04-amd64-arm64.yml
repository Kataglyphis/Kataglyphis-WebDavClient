name: Build + test + run on Linux natively - x86-64/arm64

# The whole lane lives in ContainerHub as a reusable workflow. This file is the
# configuration for it, nothing more. Do not re-inline the steps here: this repo
# and Kataglyphis-Orchestr-ANT-ion previously carried 112-line copies that
# differed on 14 lines, all of them parameters.
#
# Everything this repo used to leave unset was already the driver default, so it
# is left unset here too - only the test matrix is a real override.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  linux:
    uses: Kataglyphis/Kataglyphis-ContainerHub/.github/workflows/python-ci-linux.yml@main
    with:
      package-name: kataglyphis_webdavclient
      test-python-versions: '3.14 3.14t'
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      FTP_SERVER: ${{ secrets.SERVER }}
      FTP_USERNAME: ${{ secrets.USERNAME }}
      # This repo stores the FTP password as PASSWORD; Orchestr-ANT-ion calls it
      # PW. The reusable workflow takes a neutral name so neither has to rename.
      FTP_PASSWORD: ${{ secrets.PASSWORD }}
